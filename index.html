<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lector QR - Planta</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f6f8;

      color: #17212b;

    }


    .contenedor {

      width: 100%;

      max-width: 650px;

      margin: 0 auto;

      padding: 20px;

    }


    .encabezado {

      background: #ffffff;

      border-radius: 16px;

      padding: 28px 20px;

      margin-bottom: 18px;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.08);

      text-align: center;

    }


    .logo {

      width: 64px;

      height: 64px;

      margin: 0 auto 14px;

      border-radius: 12px;

      background: #0879b9;

      color: #ffffff;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 24px;

      font-weight: bold;

    }


    h1 {

      margin: 0 0 8px;

      font-size: 28px;

    }


    .descripcion {

      margin: 0;

      color: #657789;

      font-size: 15px;

    }


    .panel {

      background: #ffffff;

      border-radius: 16px;

      padding: 20px;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.08);

    }


    .estado {

      text-align: center;

      font-size: 16px;

      font-weight: bold;

      color: #0879b9;

      margin-bottom: 16px;

    }


    #reader {

      width: 100%;

      min-height: 360px;

      overflow: hidden;

      border-radius: 14px;

      background: #101820;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      display: block;

      border-radius: 14px;

    }


    #reader img {

      max-width: 100%;

    }


    .resultado {

      display: none;

      margin-top: 20px;

      padding: 20px;

      border-radius: 14px;

      background: #eef8f1;

      border: 1px solid #b8dec3;

      text-align: center;

    }


    .resultado-titulo {

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 12px;

      color: #23733b;

    }


    .codigo {

      font-size: 25px;

      font-weight: bold;

      word-break: break-all;

      margin-bottom: 10px;

    }


    .boton {

      width: 100%;

      margin-top: 14px;

      padding: 16px;

      border: none;

      border-radius: 9px;

      background: #0879b9;

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    .boton:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .boton-secundario {

      background: #17212b;

    }


    .error {

      margin-top: 15px;

      padding: 14px;

      border-radius: 9px;

      background: #fff0f0;

      color: #a12a2a;

      font-size: 14px;

      text-align: center;

      display: none;

    }


    .nota {

      margin-top: 16px;

      text-align: center;

      color: #71808d;

      font-size: 13px;

      line-height: 1.5;

    }


    @media (max-width: 480px) {

      .contenedor {

        padding: 12px;

      }


      .panel {

        padding: 12px;

      }


      .encabezado {

        padding: 22px 15px;

      }


      h1 {

        font-size: 24px;

      }


      #reader {

        min-height: 300px;

      }


      .codigo {

        font-size: 21px;

      }

    }

  </style>

</head>


<body>


  <main class="contenedor">


    <!-- =====================================
         ENCABEZADO
    ====================================== -->

    <section class="encabezado">

      <div class="logo">
        CR
      </div>


      <h1>
        Lector QR
      </h1>


      <p class="descripcion">
        Control de Planeación - Planta
      </p>

    </section>


    <!-- =====================================
         LECTOR
    ====================================== -->

    <section class="panel">


      <div
        id="estado"
        class="estado"
      >
        Iniciando cámara...
      </div>


      <div id="reader"></div>


      <!-- ===================================
           RESULTADO DEL QR
      ==================================== -->

      <div
        id="resultado"
        class="resultado"
      >

        <div class="resultado-titulo">

          ✓ QR DETECTADO

        </div>


        <div
          id="codigoDetectado"
          class="codigo"
        ></div>


        <button
          id="btnContinuar"
          class="boton"
          type="button"
          onclick="continuar()"
        >

          CONTINUAR

        </button>


        <button
          id="btnOtro"
          class="boton boton-secundario"
          type="button"
          onclick="reiniciarEscaner()"
        >

          ESCANEAR OTRO

        </button>

      </div>


      <!-- ===================================
           ERROR
      ==================================== -->

      <div
        id="error"
        class="error"
      ></div>


      <p class="nota">

        Apunte la cámara directamente hacia el
        código QR. No necesita tomar fotografías.

      </p>


    </section>


  </main>


  <script>


    /* =====================================================
       CONFIGURACIÓN
    ===================================================== */


    /*
     * ESTA ES LA URL CORRECTA DEL PROYECTO
     * DE CONTROL DE PLANEACIÓN.
     */

    const URL_APPS_SCRIPT =
      'https://script.google.com/macros/s/AKfycbwwFlzKNGbb5fxUecckgft3kiP56kV5hBFqEwJthGIoUQevs0Pc19hUSBkArKFzUxBosQ/exec';


    /*
     * Lector QR.
     */

    let scanner = null;


    /*
     * Código detectado.
     */

    let codigoDetectado = '';


    /*
     * Evita que el mismo QR
     * se detecte varias veces.
     */

    let escaneoRealizado = false;


    /*
     * Evita iniciar dos cámaras
     * al mismo tiempo.
     */

    let iniciandoCamara = false;


    /* =====================================================
       FUNCIONES DE INTERFAZ
    ===================================================== */


    function actualizarEstado(texto) {

      const elemento =
        document.getElementById('estado');


      if (elemento) {

        elemento.textContent =
          texto;

      }

    }


    function mostrarError(texto) {

      const elemento =
        document.getElementById('error');


      elemento.textContent =
        texto;


      elemento.style.display =
        'block';

    }


    function ocultarError() {

      const elemento =
        document.getElementById('error');


      elemento.style.display =
        'none';

  }


    /* =====================================================
       INICIAR ESCÁNER
    ===================================================== */


    function iniciarEscaner() {


      if (iniciandoCamara) {

        return;

      }


      if (scanner) {

        return;

      }


      iniciandoCamara = true;


      ocultarError();


      actualizarEstado(
        'Solicitando acceso a la cámara...'
      );


      /*
       * Creamos un lector nuevo.
       */

      try {

        scanner =
          new Html5Qrcode(
            'reader'
          );

      } catch (error) {

        scanner = null;

        iniciandoCamara = false;

        console.error(error);

        mostrarError(
          'No se pudo iniciar el lector QR.'
        );

        actualizarEstado(
          'Error al iniciar lector.'
        );

        return;

      }


      /*
       * Configuración del lector.
       */

      const configuracion = {

        fps: 10,


        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const tamaño =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.70
            );


          return {

            width: tamaño,

            height: tamaño

          };

        },


        aspectRatio: 1.0,


        formatsToSupport: [

          Html5QrcodeSupportedFormats.QR_CODE

        ]

      };


      /*
       * Iniciar cámara trasera.
       */

      scanner
        .start(

          {
            facingMode: {
              exact: 'environment'
            }
          },

          configuracion,

          cuandoDetectaQR,

          cuandoNoDetectaQR

        )


        .then(function() {

          iniciandoCamara = false;


          actualizarEstado(
            'Buscando código QR...'
          );

        })


        .catch(function(error) {

          console.warn(
            'No se pudo iniciar con cámara trasera exacta:',
            error
          );


          /*
           * Algunos teléfonos no permiten
           * "exact: environment".
           *
           * Intentamos nuevamente
           * usando simplemente environment.
           */

          if (scanner) {

            scanner
              .clear()
              .catch(function() {});

          }


          scanner = null;


          scanner =
            new Html5Qrcode(
              'reader'
            );


          scanner
            .start(

              {
                facingMode: 'environment'
              },

              configuracion,

              cuandoDetectaQR,

              cuandoNoDetectaQR

            )


            .then(function() {

              iniciandoCamara = false;


              actualizarEstado(
                'Buscando código QR...'
              );

            })


            .catch(function(errorFinal) {

              iniciandoCamara = false;

              console.error(
                errorFinal
              );


              scanner = null;


              actualizarEstado(
                'No se pudo iniciar la cámara.'
              );


              mostrarError(
                'No se pudo acceder a la cámara. ' +
                'Verifique que el navegador tenga ' +
                'permiso para utilizar la cámara.'
              );

            });

        });

    }


    /* =====================================================
       QR DETECTADO
    ===================================================== */


    function cuandoDetectaQR(
      texto,
      resultado
    ) {


      if (escaneoRealizado) {

        return;

      }


      const codigo =
        String(
          texto || ''
        ).trim();


      if (!codigo) {

        return;

      }


      /*
       * Marcamos inmediatamente
       * para evitar múltiples lecturas.
       */

      escaneoRealizado = true;


      codigoDetectado =
        codigo;


      actualizarEstado(
        'QR detectado correctamente.'
      );


      /*
       * Mostrar código.
       */

      document.getElementById(
        'codigoDetectado'
      ).textContent =
        codigoDetectado;


      /*
       * Mostrar resultado.
       */

      document.getElementById(
        'resultado'
      ).style.display =
        'block';


      /*
       * Detener cámara.
       */

      detenerEscaner();

    }


    function cuandoNoDetectaQR(error) {

      /*
       * No hacemos nada.
       *
       * El lector continúa buscando
       * automáticamente.
       */

    }


    /* =====================================================
       DETENER ESCÁNER
    ===================================================== */


    function detenerEscaner() {


      if (!scanner) {

        return Promise.resolve();

      }


      const lector =
        scanner;


      scanner = null;


      return lector
        .stop()

        .then(function() {

          try {

            lector.clear();

          } catch (error) {

          }

        })

        .catch(function(error) {

          console.warn(
            'Error al detener lector:',
            error
          );


          try {

            lector.clear();

          } catch (e) {

          }

        });

    }


    /* =====================================================
       ESCANEAR OTRO
    ===================================================== */


    function reiniciarEscaner() {


      /*
       * Ocultar resultado.
       */

      document.getElementById(
        'resultado'
      ).style.display =
        'none';


      /*
       * Limpiar código.
       */

      document.getElementById(
        'codigoDetectado'
      ).textContent =
        '';


      codigoDetectado =
        '';


      escaneoRealizado =
        false;


      ocultarError();


      /*
       * Limpiar lector.
       */

      if (scanner) {

        detenerEscaner()
          .then(function() {

            iniciarEscaner();

          });

      } else {

        iniciarEscaner();

      }

    }


    /* =====================================================
       CONTINUAR
    ===================================================== */


    function continuar() {


      if (!codigoDetectado) {

        return;

      }


      const boton =
        document.getElementById(
          'btnContinuar'
        );


      const botonOtro =
        document.getElementById(
          'btnOtro'
        );


      /*
       * Evitar doble clic.
       */

      boton.disabled =
        true;


      boton.textContent =
        'ABRIENDO...';


      botonOtro.disabled =
        true;


      /*
       * Codificamos el QR para
       * enviarlo como parámetro.
       */

      const codigo =
        encodeURIComponent(
          codigoDetectado
        );


      /*
       * ESTA ES LA PARTE IMPORTANTE.
       *
       * Abrimos el Apps Script CORRECTO
       * y enviamos:
       *
       * ?codigoQR=XXXXXXXX
       */

      const destino =
        URL_APPS_SCRIPT +
        '?codigoQR=' +
        codigo;


      /*
       * Redirigir al sistema.
       */

      window.location.href =
        destino;

    }


    /* =====================================================
       INICIO AUTOMÁTICO
    ===================================================== */


    window.addEventListener(
      'load',
      function() {

        /*
         * Pequeño retraso para asegurar
         * que el navegador terminó de cargar
         * el lector.
         */

        setTimeout(
          function() {

            iniciarEscaner();

          },
          300
        );

      }
    );


    /* =====================================================
       CERRAR AL SALIR
    ===================================================== */


    window.addEventListener(
      'beforeunload',
      function() {

        if (scanner) {

          scanner
            .stop()

            .catch(
              function() {}
            );

        }

      }
    );


  </script>


</body>

</html>
