<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lector QR - Planta</title>


  <!-- =========================================
       LIBRERÍA LECTOR QR
  ========================================== -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f6f8;

      color: #17212b;

    }


    /* =========================================
       CONTENEDOR
    ========================================== */

    .contenedor {

      width: 100%;

      max-width: 650px;

      margin: 0 auto;

      padding: 20px;

    }


    /* =========================================
       ENCABEZADO
    ========================================== */

    .encabezado {

      background: #ffffff;

      border-radius: 16px;

      padding: 28px 20px;

      margin-bottom: 18px;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.08);

      text-align: center;

    }


    .logo {

      width: 64px;

      height: 64px;

      margin: 0 auto 14px;

      border-radius: 12px;

      background: #0879b9;

      color: #ffffff;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 24px;

      font-weight: bold;

    }


    h1 {

      margin: 0 0 8px;

      font-size: 28px;

    }


    .descripcion {

      margin: 0;

      color: #657789;

      font-size: 15px;

    }


    /* =========================================
       PANEL
    ========================================== */

    .panel {

      background: #ffffff;

      border-radius: 16px;

      padding: 20px;

      box-shadow:
        0 4px 18px rgba(0,0,0,0.08);

    }


    /* =========================================
       ESTADO
    ========================================== */

    .estado {

      text-align: center;

      font-size: 16px;

      font-weight: bold;

      color: #0879b9;

      margin-bottom: 16px;

    }


    /* =========================================
       LECTOR
    ========================================== */

    #reader {

      width: 100%;

      min-height: 360px;

      overflow: hidden;

      border-radius: 14px;

      background: #101820;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      display: block;

      border-radius: 14px;

    }


    #reader img {

      max-width: 100%;

    }


    /* =========================================
       RESULTADO
    ========================================== */

    .resultado {

      display: none;

      margin-top: 20px;

      padding: 20px;

      border-radius: 14px;

      background: #eef8f1;

      border: 1px solid #b8dec3;

      text-align: center;

    }


    .resultado-titulo {

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 12px;

      color: #23733b;

    }


    .codigo {

      font-size: 25px;

      font-weight: bold;

      word-break: break-all;

      margin-bottom: 10px;

    }


    /* =========================================
       BOTONES
    ========================================== */

    .boton {

      width: 100%;

      margin-top: 14px;

      padding: 16px;

      border: none;

      border-radius: 9px;

      background: #0879b9;

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    .boton:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .boton-secundario {

      background: #17212b;

    }


    /* =========================================
       ERROR
    ========================================== */

    .error {

      margin-top: 15px;

      padding: 14px;

      border-radius: 9px;

      background: #fff0f0;

      color: #a12a2a;

      font-size: 14px;

      text-align: center;

      display: none;

    }


    /* =========================================
       NOTA
    ========================================== */

    .nota {

      margin-top: 16px;

      text-align: center;

      color: #71808d;

      font-size: 13px;

      line-height: 1.5;

    }


    /* =========================================
       CELULARES
    ========================================== */

    @media (max-width: 480px) {

      .contenedor {

        padding: 12px;

      }


      .panel {

        padding: 12px;

      }


      .encabezado {

        padding: 22px 15px;

      }


      h1 {

        font-size: 24px;

      }


      #reader {

        min-height: 300px;

      }


      .codigo {

        font-size: 21px;

      }

    }

  </style>

</head>


<body>


  <main class="contenedor">


    <!-- =====================================
         ENCABEZADO
    ====================================== -->

    <section class="encabezado">

      <div class="logo">
        CR
      </div>


      <h1>
        Lector QR
      </h1>


      <p class="descripcion">
        Control de Planeación - Planta
      </p>

    </section>


    <!-- =====================================
         LECTOR
    ====================================== -->

    <section class="panel">


      <div
        id="estado"
        class="estado"
      >
        Iniciando cámara...
      </div>


      <div id="reader"></div>


      <!-- ===================================
           RESULTADO DEL QR
      ==================================== -->

      <div
        id="resultado"
        class="resultado"
      >

        <div class="resultado-titulo">

          ✓ QR DETECTADO

        </div>


        <div
          id="codigoDetectado"
          class="codigo"
        ></div>


        <button
          id="btnContinuar"
          class="boton"
          type="button"
          onclick="continuar()"
        >

          CONTINUAR

        </button>


        <button
          id="btnOtro"
          class="boton boton-secundario"
          type="button"
          onclick="reiniciarEscaner()"
        >

          ESCANEAR OTRO

        </button>


      </div>


      <!-- ===================================
           ERROR
      ==================================== -->

      <div
        id="error"
        class="error"
      ></div>


      <p class="nota">

        Apunte la cámara directamente hacia el
        código QR. No necesita tomar fotografías.

      </p>


    </section>


  </main>



  <script>


    /* =====================================================
       MODO CIERRE
    ===================================================== */

    const MODO_CERRAR =
      new URLSearchParams(
        window.location.search
      ).get(
        'cerrar'
      ) === '1';


    function cerrarVentanaLector() {


      const mensaje = {
        tipo: 'PLANTA_CAMBIOS_GUARDADOS'
      };


      /*
       * Avisar primero a la pestaña principal, que conserva la
       * referencia exacta de esta pestaña y puede cerrarla.
       */
      try {

        if (
          window.opener &&
          !window.opener.closed
        ) {

          window.opener.postMessage(
            mensaje,
            '*'
          );

        }

      } catch (error) {

      }


      /*
       * Intento directo de cierre. Esta pestaña fue creada mediante
       * window.open(), por lo que el navegador debe permitir el cierre.
       */
      try {

        window.close();

      } catch (error) {

      }


      /*
       * Respaldo para navegadores que necesiten un pequeño retraso.
       */
      setTimeout(
        function() {

          try {

            window.close();

          } catch (error) {

          }

        },
        250
      );

    }


    /* =====================================================
       CONFIGURACIÓN
    ===================================================== */


    const URL_APPS_SCRIPT =
      'https://script.google.com/macros/s/AKfycbwwFlzKNGbb5fxUecckgft3kiP56kV5hBFqEwJthGIoUQevs0Pc19hUSBkArKFzUxBosQ/exec';


    /* =====================================================
       VARIABLES
    ===================================================== */


    let scanner = null;

    let codigoDetectado = '';

    let escaneoRealizado = false;

    let iniciandoCamara = false;

    let deteniendoCamara = null;


    /* =====================================================
       INTERFAZ
    ===================================================== */


    function actualizarEstado(texto) {

      const elemento =
        document.getElementById('estado');


      if (elemento) {

        elemento.textContent = texto;

      }

    }


    function mostrarError(texto) {

      const elemento =
        document.getElementById('error');


      if (!elemento) {
        return;
      }


      elemento.textContent = texto;

      elemento.style.display = 'block';

    }


    function ocultarError() {

      const elemento =
        document.getElementById('error');


      if (!elemento) {
        return;
      }


      elemento.textContent = '';

      elemento.style.display = 'none';

    }


    /* =====================================================
       INICIAR ESCÁNER
    ===================================================== */


    async function iniciarEscaner() {


      /*
       * Si todavía estamos cerrando
       * una cámara anterior, esperamos.
       */

      if (deteniendoCamara) {

        try {

          await deteniendoCamara;

        } catch (error) {

        }

      }


      /*
       * Evitar dos inicializaciones.
       */

      if (iniciandoCamara) {
        return;
      }


      if (scanner) {
        return;
      }


      iniciandoCamara = true;

      ocultarError();


      actualizarEstado(
        'Solicitando acceso a la cámara...'
      );


      /*
       * Limpiar completamente
       * el contenedor visual.
       */

      const reader =
        document.getElementById('reader');


      if (reader) {

        reader.innerHTML = '';

      }


      try {


        scanner =
          new Html5Qrcode('reader');


        const configuracion = {

          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const tamaño =
              Math.floor(
                Math.min(
                  viewfinderWidth,
                  viewfinderHeight
                ) * 0.70
              );


            return {

              width: tamaño,

              height: tamaño

            };

          },

          aspectRatio: 1.0,

          formatsToSupport: [

            Html5QrcodeSupportedFormats.QR_CODE

          ]

        };


        /*
         * Intentar primero cámara trasera.
         */

        try {


          await scanner.start(

            {
              facingMode: {
                exact: 'environment'
              }
            },

            configuracion,

            cuandoDetectaQR,

            cuandoNoDetectaQR

          );


        } catch (errorTrasera) {


          console.warn(
            'Cámara trasera exacta no disponible.',
            errorTrasera
          );


          /*
           * Si falla, detener y limpiar
           * antes del segundo intento.
           */

          const lectorAnterior =
            scanner;


          scanner = null;


          try {

            await lectorAnterior.stop();

          } catch (error) {

          }


          try {

            lectorAnterior.clear();

          } catch (error) {

          }


          /*
           * Crear nuevamente el lector.
           */

          scanner =
            new Html5Qrcode('reader');


          /*
           * Segundo intento:
           * cámara environment normal.
           */

          await scanner.start(

            {
              facingMode: 'environment'
            },

            configuracion,

            cuandoDetectaQR,

            cuandoNoDetectaQR

          );

        }


        iniciandoCamara = false;


        actualizarEstado(
          'Buscando código QR...'
        );


      } catch (errorFinal) {


        console.error(
          'No se pudo iniciar la cámara:',
          errorFinal
        );


        scanner = null;

        iniciandoCamara = false;


        actualizarEstado(
          'No se pudo iniciar la cámara.'
        );


        mostrarError(
          'No se pudo acceder a la cámara. ' +
          'Verifique que el navegador tenga permiso ' +
          'para utilizar la cámara.'
        );

      }

    }


    /* =====================================================
       QR DETECTADO
    ===================================================== */


    async function cuandoDetectaQR(
      texto,
      resultado
    ) {


      if (escaneoRealizado) {
        return;
      }


      const codigo =
        String(
          texto || ''
        ).trim();


      if (!codigo) {
        return;
      }


      /*
       * Bloquear inmediatamente
       * nuevas lecturas.
       */

      escaneoRealizado = true;


      codigoDetectado =
        codigo;


      actualizarEstado(
        'QR detectado correctamente.'
      );


      /*
       * Mostrar código.
       */

      const campoCodigo =
        document.getElementById(
          'codigoDetectado'
        );


      if (campoCodigo) {

        campoCodigo.textContent =
          codigoDetectado;

      }


      /*
       * Mostrar resultado.
       */

      const resultadoElemento =
        document.getElementById(
          'resultado'
        );


      if (resultadoElemento) {

        resultadoElemento.style.display =
          'block';

      }


      /*
       * Detener cámara.
       */

      await detenerEscaner();

    }


    function cuandoNoDetectaQR(error) {

      /*
       * No hacemos nada.
       *
       * El lector continúa buscando
       * automáticamente.
       */

    }


    /* =====================================================
       DETENER ESCÁNER
    ===================================================== */


    function detenerEscaner() {


      /*
       * Si ya existe una operación
       * de cierre, devolver esa misma
       * promesa.
       */

      if (deteniendoCamara) {

        return deteniendoCamara;

      }


      if (!scanner) {

        return Promise.resolve();

      }


      const lector =
        scanner;


      /*
       * MUY IMPORTANTE:
       *
       * No ponemos scanner = null
       * antes de terminar el stop().
       */

      deteniendoCamara =
        (async function() {


          try {

            await lector.stop();

          } catch (error) {

            console.warn(
              'Error al detener cámara:',
              error
            );

          }


          try {

            lector.clear();

          } catch (error) {

            console.warn(
              'Error al limpiar lector:',
              error
            );

          }


          /*
           * Solo ahora liberamos
           * la referencia.
           */

          if (scanner === lector) {

            scanner = null;

          }


          deteniendoCamara = null;

        })();


      return deteniendoCamara;

    }


    /* =====================================================
       ESCANEAR OTRO
    ===================================================== */


    async function reiniciarEscaner() {


      const botonOtro =
        document.getElementById(
          'btnOtro'
        );


      const botonContinuar =
        document.getElementById(
          'btnContinuar'
        );


      /*
       * Evitar doble pulsación.
       */

      if (botonOtro) {

        botonOtro.disabled =
          true;

      }


      if (botonContinuar) {

        botonContinuar.disabled =
          true;

      }


      /*
       * Ocultar resultado.
       */

      const resultadoElemento =
        document.getElementById(
          'resultado'
        );


      if (resultadoElemento) {

        resultadoElemento.style.display =
          'none';

      }


      /*
       * Limpiar código.
       */

      const campoCodigo =
        document.getElementById(
          'codigoDetectado'
        );


      if (campoCodigo) {

        campoCodigo.textContent =
          '';

      }


      codigoDetectado = '';

      escaneoRealizado = false;


      ocultarError();


      actualizarEstado(
        'Preparando cámara...'
      );


      /*
       * ESPERAR a que la cámara
       * anterior termine de cerrarse.
       */

      await detenerEscaner();


      /*
       * Pequeña pausa para que el
       * navegador libere completamente
       * el dispositivo de cámara.
       */

      await new Promise(
        function(resolve) {

          setTimeout(
            resolve,
            250
          );

        }
      );


      /*
       * Limpiar visualmente.
       */

      const reader =
        document.getElementById(
          'reader'
        );


      if (reader) {

        reader.innerHTML = '';

      }


      /*
       * Volver a iniciar.
       */

      await iniciarEscaner();


      if (botonOtro) {

        botonOtro.disabled =
          false;

      }


      if (botonContinuar) {

        botonContinuar.disabled =
          false;

      }

    }


    /* =====================================================
       CONTINUAR
    ===================================================== */


    function continuar() {


      if (!codigoDetectado) {

        return;

      }


      const boton =
        document.getElementById(
          'btnContinuar'
        );


      const botonOtro =
        document.getElementById(
          'btnOtro'
        );


      if (boton) {

        boton.disabled =
          true;

        boton.textContent =
          'ABRIENDO...';

      }


      if (botonOtro) {

        botonOtro.disabled =
          true;

      }


      const codigo =
        encodeURIComponent(
          codigoDetectado
        );


      const destino =
        URL_APPS_SCRIPT +
        '?codigoQR=' +
        codigo;


      console.log(
        'QR detectado:',
        codigoDetectado
      );


      console.log(
        'Destino:',
        destino
      );


      /*
       * IMPORTANTE:
       *
       * Navegación en la MISMA pestaña.
       *
       * No usamos:
       * window.open()
       *
       * No usamos:
       * target="_blank"
       */

      window.location.assign(
        destino
      );

    }


    /* =====================================================
       INICIO AUTOMÁTICO
    ===================================================== */


    window.addEventListener(
      'load',
      function() {


        /*
         * Si esta página fue abierta con ?cerrar=1, NO iniciamos
         * la cámara. Solo avisamos a la pestaña principal y cerramos
         * inmediatamente esta pestaña secundaria.
         */
        if (MODO_CERRAR) {

          cerrarVentanaLector();

          return;

        }


        setTimeout(
          function() {

            iniciarEscaner();

          },
          300
        );

      }
    );


    /* =====================================================
       CERRAR AL SALIR
    ===================================================== */


    window.addEventListener(
      'beforeunload',
      function() {


        if (scanner) {

          scanner
            .stop()
            .catch(
              function() {}
            );

        }

      }
    );


  </script>


</body>

</html>
